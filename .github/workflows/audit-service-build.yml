name: audit-service - CI Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'bugfix/**']
    paths:
      - 'audit-service/**'
      - '.github/workflows/audit-service-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'audit-service/**'
      - '.github/workflows/audit-service-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/audit-service
  AR_REGISTRY: asia-south1-docker.pkg.dev/tesseracthub-480811/global
  GCP_PROJECT_ID: tesseracthub-480811
  GCP_REGION: asia-south1
  CLOUD_RUN_SERVICE: global-audit-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: audit-service/go.sum

      - name: Configure private Go modules
        run: git config --global url."https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/Tesseract-Nexus/*

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: audit-service/coverage.out
          flags: audit-service
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- GCP Authentication (best-effort: WIF → SA Key → skip) ---
      - name: Authenticate to Google Cloud (WIF)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: auth_wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/849928263410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@tesseracthub-480811.iam.gserviceaccount.com
          project_id: ${{ env.GCP_PROJECT_ID }}
        continue-on-error: true

      - name: Authenticate to Google Cloud (SA Key Fallback)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.auth_wif.outcome == 'failure'
        id: auth_sa
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}
        continue-on-error: true

      - name: Check GCP auth status
        id: gcp_auth
        run: |
          if [[ "${{ steps.auth_wif.outcome }}" == "success" || "${{ steps.auth_sa.outcome }}" == "success" ]]; then
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP authentication unavailable — skipping Artifact Registry push and Cloud Run deploy"
          fi

      - name: Configure Docker for Artifact Registry
        if: steps.gcp_auth.outputs.authenticated == 'true'
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: audit-service
          file: audit-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            GITHUB_TOKEN=${{ secrets.GO_PRIVATE_TOKEN }}

      # --- Copy image to Artifact Registry (only when GCP auth + main branch) ---
      - name: Generate AR tags
        if: steps.gcp_auth.outputs.authenticated == 'true'
        id: ar_tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          GHCR_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" | tr '[:upper:]' '[:lower:]')
          echo "sha_tag=main-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Push image to Artifact Registry
        if: steps.gcp_auth.outputs.authenticated == 'true'
        id: ar_push
        run: |
          docker pull ${{ steps.ar_tags.outputs.ghcr_image }}
          docker tag ${{ steps.ar_tags.outputs.ghcr_image }} \
            ${{ env.AR_REGISTRY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ steps.ar_tags.outputs.sha_tag }}
          docker tag ${{ steps.ar_tags.outputs.ghcr_image }} \
            ${{ env.AR_REGISTRY }}/${{ env.CLOUD_RUN_SERVICE }}:latest
          docker push ${{ env.AR_REGISTRY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ steps.ar_tags.outputs.sha_tag }}
          docker push ${{ env.AR_REGISTRY }}/${{ env.CLOUD_RUN_SERVICE }}:latest
        continue-on-error: true

      # --- Deploy to Cloud Run ---
      - name: Deploy to Cloud Run
        if: steps.ar_push.outcome == 'success'
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ env.AR_REGISTRY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ steps.ar_tags.outputs.sha_tag }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --allow-unauthenticated
        continue-on-error: true

      # --- Security scanning ---
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
